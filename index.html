<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="URA budget vote monitoring and payment tracking system" />
  <meta name="theme-color" content="#1C2434" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="URA Votes" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <title>URA Vote Monitoring System</title>
  <link rel="icon" href="assets/ura-logo.png" type="image/png" />
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,600,700,800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="css/styles.css?v=2" />
</head>
<body>
  <div id="root">
    <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#F1F5F9;">
      <div style="text-align:center;">
        <img src="assets/ura-logo.png" alt="URA" style="width:64px;height:64px;border-radius:14px;margin-bottom:18px;background:#fff;padding:8px;box-shadow:0 4px 16px rgba(0,0,0,0.08);" />
        <h2 style="color:#1C2434;font-size:20px;font-weight:800;margin-bottom:8px;letter-spacing:-0.3px;">URA VoteTrack</h2>
        <p style="color:#64748b;font-size:13px;">Loading application...</p>
        <div style="width:120px;height:4px;background:#E2E8F0;border-radius:4px;margin:16px auto 0;overflow:hidden;">
          <div style="width:40%;height:100%;background:#3C50E0;border-radius:4px;animation:loadslide 1s ease-in-out infinite;"></div>
        </div>
        <style>@keyframes loadslide{0%{transform:translateX(-120%)}100%{transform:translateX(320%)}}</style>
      </div>
    </div>
  </div>

  <!-- React -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>

  <!-- Firebase (compat SDK) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

  <!-- jsPDF for PDF export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.4/jspdf.plugin.autotable.min.js"></script>

  <!-- App Data & Config -->
  <script src="js/data.js"></script>
  <script src="js/config.js"></script>
  <script src="js/firebase.js"></script>

  <!-- App Logic -->
  <script type="text/babel" src="js/app.js?v=2"></script>

  <!-- Service Worker (offline + add to home screen) -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
